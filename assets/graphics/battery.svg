<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="cell"><rect x="492" y="96" width="80" height="168" rx="10"/></clipPath>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0e7490"/></marker>
  </defs>
  <rect width="640" height="360" rx="18" fill="#f8fafc"/>
  <text x="320" y="34" font-size="17" font-weight="700" fill="#1b2330" text-anchor="middle">State of charge in real time from a reduced-order model</text>

  <!-- drive-cycle current -->
  <g transform="translate(36 90)">
    <rect width="190" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="12" y="22" font-size="12.5" font-weight="700" fill="#1b2330">Drive-cycle current</text>
    <line x1="14" y1="100" x2="178" y2="100" stroke="#94a3b8"/>
    <path id="drv" d="M14 100 L26 70 L34 70 L40 112 L52 112 L58 52 L70 52 L76 128 L90 128 L96 82 L108 82 L114 100 L124 60 L134 60 L140 118 L152 118 L158 76 L170 76 L178 100" fill="none" stroke="#2563eb" stroke-width="2.4"/>
    <circle r="5" fill="#ef4444"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#drv"/></animateMotion></circle>
    <text x="96" y="156" font-size="11" fill="#5d6878" text-anchor="middle">measured current &amp; voltage</text>
  </g>
  <line x1="232" y1="175" x2="282" y2="175" stroke="#0e7490" stroke-width="3" marker-end="url(#arr)"/>

  <!-- model block -->
  <g transform="translate(290 118)">
    <rect width="150" height="114" rx="12" fill="#0e7490"/>
    <text x="75" y="44" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Reduced-order</text>
    <text x="75" y="64" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">model</text>
    <text x="75" y="88" font-size="11.5" fill="#cffafe" text-anchor="middle">discrete-time realisation</text>
    <rect width="150" height="114" rx="12" fill="none" stroke="#67e8f9" stroke-width="3"><animate attributeName="stroke-opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="446" y1="175" x2="484" y2="175" stroke="#0e7490" stroke-width="3" marker-end="url(#arr)"/>

  <!-- battery with animated SOC -->
  <rect x="518" y="84" width="28" height="12" rx="3" fill="#475569"/>
  <rect x="492" y="96" width="80" height="168" rx="10" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <g clip-path="url(#cell)">
    <rect x="492" width="80" fill="#22c55e">
      <animate attributeName="y" values="110;210;150;230;110" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="154;54;114;34;154" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22c55e;#f59e0b;#84cc16;#ef4444;#22c55e" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="532" y="292" font-size="13" font-weight="700" fill="#1b2330" text-anchor="middle">State of charge</text>
  <text x="532" y="308" font-size="11.5" fill="#5d6878" text-anchor="middle">estimated on line</text>
  <text x="320" y="338" font-size="12.5" fill="#5d6878" text-anchor="middle">fast enough for a battery-management system · validated over standard drive cycles</text>
</svg>
