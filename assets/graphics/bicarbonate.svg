<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="ni" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#d6d3d1"/><circle cx="6" cy="6" r="3.4" fill="#f5f5f4"/>
    </pattern>
    <pattern id="ag" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#3b4656"/><circle cx="3" cy="3" r="1.4" fill="#e5e7eb"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#facc15" stop-opacity=".9"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <g id="hp"><circle r="6" fill="#ef4444"/><text y="3.8" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H⁺</text></g>
    <g id="oh"><circle r="6" fill="#2563eb"/><text y="3.6" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">OH⁻</text></g>
    <g id="hco3"><circle r="7.5" fill="#16a34a"/><text y="3.2" font-size="6.6" font-weight="700" fill="#fff" text-anchor="middle">HCO₃⁻</text></g>
    <g id="co"><circle r="4.2" fill="#334155"/><circle cx="7" r="3.4" fill="#ef4444"/></g>
  </defs>
  <rect width="640" height="360" rx="18" fill="#f8fafc"/>
  <text x="320" y="34" font-size="17" font-weight="700" fill="#1b2330" text-anchor="middle">Bicarbonate electrolyser: CO₂ is released inside the cell</text>

  <rect x="30" y="60" width="110" height="220" fill="url(#ni)"/>
  <rect x="140" y="60" width="50" height="220" fill="#bfdbfe"/>
  <rect x="190" y="60" width="50" height="220" fill="#fecaca"/>
  <rect x="240" y="60" width="18" height="220" fill="url(#ag)"/>
  <rect x="258" y="60" width="352" height="220" fill="#dcfce7"/>
  <rect x="160" y="60" width="60" height="220" fill="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/></rect>
  <line x1="190" y1="60" x2="190" y2="280" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- catholyte flow -->
  <g stroke="#16a34a" stroke-width="2" fill="none" opacity=".55">
    <path d="M330 70 v40 m-6 -8 l6 8 l6 -8"/><path d="M450 70 v40 m-6 -8 l6 8 l6 -8"/><path d="M570 70 v40 m-6 -8 l6 8 l6 -8"/>
  </g>
  <!-- bicarbonate drifting to the catalyst layer -->
  <use href="#hco3"><animateMotion path="M590,110 L262,115" dur="4.5s" repeatCount="indefinite"/></use>
  <use href="#hco3"><animateMotion path="M590,150 L262,160" dur="5s" begin="-1.6s" repeatCount="indefinite"/></use>
  <use href="#hco3"><animateMotion path="M590,195 L262,200" dur="4.7s" begin="-3s" repeatCount="indefinite"/></use>
  <!-- water splitting at the junction -->
  <use href="#hp"><animateMotion path="M192,120 L250,135" dur="1.8s" repeatCount="indefinite"/></use>
  <use href="#hp"><animateMotion path="M192,200 L250,205" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></use>
  <use href="#hp"><animateMotion path="M192,250 L250,250" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></use>
  <use href="#oh"><animateMotion path="M188,110 L70,120" dur="2.4s" repeatCount="indefinite"/></use>
  <use href="#oh"><animateMotion path="M188,190 L70,185" dur="2.4s" begin="-.8s" repeatCount="indefinite"/></use>
  <use href="#oh"><animateMotion path="M188,245 L70,250" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></use>
  <!-- CO2 released and reduced; CO bubbles leave -->
  <g fill="#ffffff" stroke="#475569" stroke-width="1.6">
    <circle cx="272" r="7"><animate attributeName="cy" values="265;70" dur="3s" repeatCount="indefinite"/><animate attributeName="cx" values="268;300" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="282" r="5"><animate attributeName="cy" values="200;70" dur="2.4s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cx" values="266;310" dur="2.4s" begin="-1s" repeatCount="indefinite"/></circle>
  </g>
  <use href="#co"><animateMotion path="M262,170 C300,150 330,110 380,90" dur="2.6s" repeatCount="indefinite"/></use>
  <use href="#co"><animateMotion path="M262,235 C300,220 340,180 400,150" dur="2.8s" begin="-1.3s" repeatCount="indefinite"/></use>
  <!-- O2 bubbles at the anode -->
  <g fill="none" stroke="#0e7490" stroke-width="1.6">
    <circle cx="60" r="5"><animate attributeName="cy" values="275;65" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="95" r="4"><animate attributeName="cy" values="275;65" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="118" r="6"><animate attributeName="cy" values="275;65" dur="3.3s" begin="-2s" repeatCount="indefinite"/></circle>
  </g>

  <g font-size="12" font-weight="700" fill="#1b2330">
    <rect x="356" y="222" width="236" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="368" y="243">H⁺ + HCO₃⁻ → CO₂ + H₂O</text>
    <text x="368" y="262">CO₂ + 2e⁻ + H₂O → CO + 2OH⁻</text>
  </g>
  <g font-size="12.5" font-weight="700" fill="#1b2330" text-anchor="middle">
    <text x="80" y="300">Ni-foam</text><text x="80" y="315">anode</text>
    <text x="192" y="300">Bipolar</text><text x="192" y="315">membrane</text>
    <text x="252" y="335">Ag catalyst layer</text>
    <text x="450" y="300">KHCO₃ catholyte</text><text x="450" y="315" font-weight="500" fill="#5d6878">captured carbon, no CO₂ gas feed</text>
  </g>
</svg>
