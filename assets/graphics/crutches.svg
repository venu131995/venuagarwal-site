<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="fib" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#d5dde6"/><line x1="0" y1="7" x2="14" y2="7" stroke="#a9b6c4" stroke-width="2.2"/>
    </pattern>
    <pattern id="ag" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#3b4656"/><circle cx="3" cy="3" r="1.4" fill="#e5e7eb"/>
    </pattern>
    <g id="co2"><circle r="4.2" fill="#334155"/><circle cx="-7" r="3.4" fill="#ef4444"/><circle cx="7" r="3.4" fill="#ef4444"/></g>
    <g id="co"><circle r="4.2" fill="#334155"/><circle cx="7" r="3.4" fill="#ef4444"/></g>
    <g id="cs"><circle r="5.5" fill="#8b5cf6"/><text y="3.6" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">+</text></g>
  </defs>
  <rect width="640" height="360" rx="18" fill="#f8fafc"/>
  <text x="320" y="34" font-size="17" font-weight="700" fill="#1b2330" text-anchor="middle">Zero-gap CO₂ electrolyser: where flooding and salt build up</text>

  <!-- layers -->
  <rect x="30" y="60" width="120" height="220" fill="#e0f2fe"/>
  <rect x="150" y="60" width="110" height="220" fill="url(#fib)"/>
  <rect x="260" y="60" width="26" height="220" fill="#9aa8b8"/>
  <rect x="286" y="60" width="16" height="220" fill="url(#ag)"/>
  <rect x="302" y="60" width="40" height="220" fill="#fde68a"/>
  <rect x="342" y="60" width="14" height="220" fill="#7c3f1d"/>
  <rect x="356" y="60" width="80" height="220" fill="#d6d3d1"/>
  <rect x="436" y="60" width="174" height="220" fill="#ede9fe"/>
  <g stroke="#ffffff" stroke-width="1" opacity=".7"><line x1="150" y1="60" x2="150" y2="280"/><line x1="436" y1="60" x2="436" y2="280"/></g>

  <!-- flooding: liquid water growing in GDL/MPL pores -->
  <g fill="#3b82f6" fill-opacity=".75">
    <circle cx="246" cy="100" r="0"><animate attributeName="r" values="0;9;11;0" keyTimes="0;.5;.85;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="150" r="0"><animate attributeName="r" values="0;7;12;0" keyTimes="0;.4;.85;1" dur="8s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="205" r="0"><animate attributeName="r" values="0;10;12;0" keyTimes="0;.5;.85;1" dur="8s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="214" cy="245" r="0"><animate attributeName="r" values="0;6;9;0" keyTimes="0;.55;.85;1" dur="8s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="272" cy="125" r="0"><animate attributeName="r" values="0;8;9;0" keyTimes="0;.35;.85;1" dur="8s" begin="-.5s" repeatCount="indefinite"/></circle>
    <circle cx="272" cy="230" r="0"><animate attributeName="r" values="0;8;9;0" keyTimes="0;.35;.85;1" dur="8s" begin="-2.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- salt crystals appearing -->
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.4">
    <rect x="236" y="168" width="11" height="11" transform="rotate(20 241 173)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.6;.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="252" y="80" width="9" height="9" transform="rotate(-15 256 84)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.7;.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="222" y="212" width="12" height="12" transform="rotate(35 228 218)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.6;.75;.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="264" y="256" width="9" height="9" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.65;.9;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- CO2 in, CO out -->
  <use href="#co2"><animateMotion path="M45,95 L290,110" dur="3.2s" repeatCount="indefinite"/></use>
  <use href="#co2"><animateMotion path="M45,185 L290,175" dur="3.6s" begin="-1.1s" repeatCount="indefinite"/></use>
  <use href="#co2"><animateMotion path="M45,250 L290,240" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/></use>
  <use href="#co"><animateMotion path="M290,140 L45,128" dur="3.4s" begin="-.6s" repeatCount="indefinite"/></use>
  <use href="#co"><animateMotion path="M290,215 L45,222" dur="3.8s" begin="-1.9s" repeatCount="indefinite"/></use>
  <!-- Cs+ crossing from the anolyte -->
  <use href="#cs"><animateMotion path="M600,120 L294,130" dur="5s" repeatCount="indefinite"/></use>
  <use href="#cs"><animateMotion path="M600,200 L294,195" dur="5.5s" begin="-1.7s" repeatCount="indefinite"/></use>
  <use href="#cs"><animateMotion path="M600,260 L294,250" dur="5.2s" begin="-3.3s" repeatCount="indefinite"/></use>

  <!-- O2 bubbles at anode -->
  <g fill="none" stroke="#0e7490" stroke-width="1.6">
    <circle cx="380" r="5"><animate attributeName="cy" values="275;65" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="405" r="4"><animate attributeName="cy" values="275;65" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="422" r="6"><animate attributeName="cy" values="275;65" dur="3.3s" begin="-2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- labels -->
  <g font-size="12.5" font-weight="700" fill="#1b2330" text-anchor="middle">
    <text x="90" y="300">Gas channel</text><text x="90" y="315" font-weight="500" fill="#5d6878">CO₂ in, CO out</text>
    <text x="205" y="300">GDL</text>
    <text x="273" y="300">MPL</text>
    <text x="294" y="316">CL</text>
    <text x="322" y="300">AEM</text>
    <text x="396" y="300">Anode</text>
    <text x="523" y="300">Anolyte</text><text x="523" y="315" font-weight="500" fill="#5d6878">Cs⁺ salt solution</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#1b2330" transform="translate(40 342)">
    <use href="#co2" x="8" y="-4"/><text x="22" y="0">CO₂</text>
    <use href="#co" x="78" y="-4"/><text x="92" y="0">CO</text>
    <circle cx="140" cy="-4" r="6" fill="#3b82f6" fill-opacity=".75"/><text x="152" y="0">liquid water</text>
    <rect x="240" y="-10" width="11" height="11" fill="#fff" stroke="#64748b" stroke-width="1.4"/><text x="258" y="0">(bi)carbonate salt</text>
    <use href="#cs" x="384" y="-4"/><text x="396" y="0">Cs⁺ crossover</text>
    <circle cx="500" cy="-4" r="5" fill="none" stroke="#0e7490" stroke-width="1.6"/><text x="511" y="0">O₂</text>
  </g>
</svg>
